<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#006D77">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Hotel stock, department usage, and daily reports for The Dream Of Sau Inn Beach Hotel.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="DreamStore">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>DreamStore | Sau Inn Beach Hotel</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { height: 100%; margin: 0; background: #f9faf7; }
    body { font-family: Arial, sans-serif; }
    #app-loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background: #f9faf7;
      color: #183b40;
      transition: opacity 180ms ease;
    }
    #app-loading .content { text-align: center; padding: 24px; }
    #app-loading img { width: 112px; height: 112px; object-fit: contain; }
    #app-loading strong { display: block; margin-top: 14px; font-size: 20px; }
    #app-loading span { display: block; margin-top: 6px; font-size: 14px; opacity: .72; }
    #app-loading .bar {
      width: 160px;
      height: 4px;
      margin: 20px auto 0;
      overflow: hidden;
      border-radius: 99px;
      background: #d8e8e8;
    }
    #app-loading .bar::after {
      content: '';
      display: block;
      width: 45%;
      height: 100%;
      border-radius: inherit;
      background: #006d77;
      animation: loading 1.1s ease-in-out infinite alternate;
    }
    @keyframes loading { from { transform: translateX(-10%); } to { transform: translateX(135%); } }
    @media (prefers-color-scheme: dark) {
      html, body, #app-loading { background: #101416; color: #e3eeee; }
      #app-loading .bar { background: #304548; }
    }
    @media (prefers-reduced-motion: reduce) {
      #app-loading .bar::after { animation: none; width: 100%; }
    }
  </style>
</head>
<body>
  <div id="app-loading" role="status" aria-live="polite">
    <div class="content">
      <img src="icons/Icon-192.png" alt="Sau Inn Beach Hotel">
      <strong>DreamStore</strong>
      <span>Preparing the hotel stock desk...</span>
      <div class="bar" aria-hidden="true"></div>
    </div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    const removeLoadingScreen = () => {
      const loading = document.getElementById('app-loading');
      if (!loading) return;
      loading.style.opacity = '0';
      window.setTimeout(() => loading.remove(), 200);
    };
    window.addEventListener('flutter-first-frame', removeLoadingScreen, { once: true });
    window.setTimeout(removeLoadingScreen, 20000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
